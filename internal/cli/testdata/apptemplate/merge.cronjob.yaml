---
# Source: app-template/templates/common.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic
  labels:
    app.kubernetes.io/controller: restic
    app.kubernetes.io/instance: restic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: restic
    helm.sh/chart: app-template-4.6.2
  namespace: app
spec:
  suspend: false
  concurrencyPolicy: Replace
  startingDeadlineSeconds: 30
  timeZone: UTC
  schedule: "*/30 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 6
      template:
        metadata:
          labels: 
            app.kubernetes.io/controller: restic
            app.kubernetes.io/instance: restic
            app.kubernetes.io/name: restic
        spec: 
          enableServiceLinks: false
          serviceAccountName: default
          automountServiceAccountToken: false
          hostIPC: false
          hostNetwork: true
          hostPID: false
          dnsPolicy: ClusterFirstWithHostNet
          restartPolicy: Never
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                    - amd64
            podAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
              - podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: app
                  topologyKey: kubernetes.io/hostname
                weight: 10
          containers: 
            - command:
              - /bin/sh
              - -c
              - restic backup /data
              env:
              - name: TZ
                value: Europe/Berlin
              - name: RESTIC_HOST
                value: legacy
              image: ghcr.io/gabe565/restic:0.19.1@sha256:495346252a3c601e9c98b216030149db3278a7295d90d0e325c8684419d277ef
              name: restic
              volumeMounts:
              - mountPath: /data
                name: data
          volumes: 
            - name: data
              persistentVolumeClaim:
                claimName: app
