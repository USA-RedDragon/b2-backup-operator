---
# Source: app-template/templates/common.yaml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic
  labels:
    app.kubernetes.io/controller: restic
    app.kubernetes.io/instance: restic
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: restic
    helm.sh/chart: app-template-4.6.2
  namespace: app
spec:
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  timeZone: America/Chicago
  schedule: "0 0 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 6
      template:
        metadata:
          labels: 
            app.kubernetes.io/controller: restic
            app.kubernetes.io/instance: restic
            app.kubernetes.io/name: restic
        spec: 
          enableServiceLinks: false
          serviceAccountName: default
          automountServiceAccountToken: false
          hostIPC: false
          hostNetwork: false
          hostPID: false
          dnsPolicy: ClusterFirst
          restartPolicy: Never
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: app
                topologyKey: kubernetes.io/hostname
          containers: 
            - command:
              - sh
              - -c
              - |
                exec > >(ts '%H:%M:%S') 2>&1
                set -eu
                restic backup --tag=db --stdin-from-command -- backup-cnpg.sh
                restic backup --tag=files /data
                restic forget --prune --keep-daily=90 --keep-weekly=24 --keep-monthly=24 --keep-yearly=20
                restic cache --cleanup
              env:
              - name: RESTIC_HOST
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: TZ
                value: America/Chicago
              envFrom:
              - secretRef:
                  name: restic-b2
              - secretRef:
                  name: restic-envs
              image: jacob.pub/ghcr.io/gabe565/restic:0.19.1@sha256:3c42c281443525045d82dd46f8e020569b13b46bc60fefb25e1428a6cff53d25
              name: restic
              resources:
                limits:
                  cpu: 1000m
                  memory: 1Gi
                requests:
                  cpu: 10m
                  memory: 256Mi
              volumeMounts:
              - mountPath: /data
                name: data
              - mountPath: /mirror
                name: mirror
                readOnly: true
              - mountPath: /postgresql-app
                name: postgresql-app
              workingDir: /data
          volumes: 
            - name: data
              persistentVolumeClaim:
                claimName: app
            - name: mirror
              persistentVolumeClaim:
                claimName: app-mirror
            - name: postgresql-app
              secret:
                secretName: postgresql-app