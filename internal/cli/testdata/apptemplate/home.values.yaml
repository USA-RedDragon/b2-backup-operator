defaultPodOptions:
  automountServiceAccountToken: false
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: app
controllers:
  restic:
    type: cronjob
    cronjob:
      schedule: 0 0 * * *
      timeZone: America/Chicago
      concurrencyPolicy: Forbid
      ttlSecondsAfterFinished: 3600
    containers:
      restic:
        image:
          repository: jacob.pub/ghcr.io/gabe565/restic
          tag: 0.19.1@sha256:3c42c281443525045d82dd46f8e020569b13b46bc60fefb25e1428a6cff53d25
        workingDir: /data
        envFrom:
          - secretRef:
              name: restic-b2
          - secretRef:
              name: restic-envs
        env:
          TZ: America/Chicago
          RESTIC_HOST:
            fieldRef:
              fieldPath: metadata.namespace
        command:
          - sh
          - -c
          - |
            exec > >(ts '%H:%M:%S') 2>&1
            set -eu
            restic backup --tag=db --stdin-from-command -- backup-cnpg.sh
            restic backup --tag=files /data
            restic forget --prune --keep-daily=90 --keep-weekly=24 --keep-monthly=24 --keep-yearly=20
            restic cache --cleanup
        resources:
          requests:
            cpu: 10m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
  init:
    type: job
    annotations:
      helm.sh/hook: post-install
      helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    containers:
      init:
        image:
          repository: jacob.pub/ghcr.io/gabe565/restic
          tag: 0.19.1
        command: [sh, -c, "restic init || true"]
persistence:
  data:
    existingClaim: app
  postgresql-app:
    type: secret
    name: postgresql-app
  mirror:
    existingClaim: app-mirror
    advancedMounts:
      restic:
        restic:
          - path: /mirror
            readOnly: true
  unrelated:
    existingClaim: other
    advancedMounts:
      init:
        init:
          - path: /other
