apiVersion: apps/v1
kind: Deployment
metadata:
  name: b2-stub
  namespace: b2-backup-operator-system
  labels:
    app.kubernetes.io/name: b2-stub
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: b2-stub
  template:
    metadata:
      labels:
        app.kubernetes.io/name: b2-stub
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stub
          image: example.com/b2-stub:v0.0.1
          imagePullPolicy: IfNotPresent
          env:
            - name: MASTER_KEY_ID
              value: stub-master-key-id
            - name: MASTER_KEY
              value: stub-master-key
            - name: S3_API_URL
              value: https://s3.us-east-005.b2-stub.invalid
            - name: BUCKETS
              value: e2e-shared
            - name: FILES
              value: e2e-shared:restic/adopted/config e2e-shared:restic/orphaned/config
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: b2-stub
  namespace: b2-backup-operator-system
spec:
  selector:
    app.kubernetes.io/name: b2-stub
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: Secret
metadata:
  name: b2-credentials
  namespace: b2-backup-operator-system
stringData:
  B2_APPLICATION_KEY_ID: stub-master-key-id
  B2_APPLICATION_KEY: stub-master-key
