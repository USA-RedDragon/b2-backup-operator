apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: b2-backup-operator
    app.kubernetes.io/managed-by: kustomize
  name: repository-admin-role
rules:
- apiGroups:
  - b2backup.mcswain.dev
  resources:
  - repositories
  verbs:
  - '*'
- apiGroups:
  - b2backup.mcswain.dev
  resources:
  - repositories/status
  verbs:
  - get
