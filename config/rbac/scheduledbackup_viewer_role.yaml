apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: b2-backup-operator
    app.kubernetes.io/managed-by: kustomize
  name: scheduledbackup-viewer-role
rules:
- apiGroups:
  - b2backup.mcswain.dev
  resources:
  - scheduledbackups
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - b2backup.mcswain.dev
  resources:
  - scheduledbackups/status
  verbs:
  - get
