---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: repositories.b2backup.mcswain.dev
spec:
  group: b2backup.mcswain.dev
  names:
    kind: Repository
    listKind: RepositoryList
    plural: repositories
    singular: repository
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.repositoryID
      name: Repo ID
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.initialized
      name: Initialized
      type: boolean
    - jsonPath: .status.currentUsage
      name: Usage
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: Repository is a restic repository hosted on BorgBase.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RepositorySpec defines the desired state of a Repository.
            properties:
              alertDays:
                description: |-
                  AlertDays is how many quiet days pass before BorgBase alerts. Unset leaves the
                  repository's current setting.
                format: int32
                minimum: 0
                type: integer
              apiTokenSecretRef:
                description: APITokenSecretRef points at the BorgBase API token. Defaults
                  to the operator's own token.
                properties:
                  key:
                    description: The key of the secret to select from.  Must be a
                      valid secret key.
                    type: string
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  optional:
                    description: Specify whether the Secret or its key must be defined
                    type: boolean
                required:
                - key
                type: object
                x-kubernetes-map-type: atomic
              appendOnly:
                description: AppendOnly makes the repository reject deletes and overwrites.
                type: boolean
              deletionPolicy:
                default: Retain
                description: DeletionPolicy decides whether the BorgBase repository
                  outlives this resource.
                enum:
                - Retain
                - Delete
                type: string
              existingRepositoryID:
                description: ExistingRepositoryID adopts an existing BorgBase repository
                  instead of creating one.
                pattern: ^[a-z0-9]{4,32}$
                type: string
              interval:
                default: 1h
                description: Interval is how often the repository is reconciled against
                  the BorgBase API.
                type: string
                x-kubernetes-validations:
                - message: must be a Go duration such as 30m, 1h or 1h30m
                  rule: self == '0' || self.matches('^([0-9]+([.][0-9]+)?(ns|us|ms|s|m|h))+$')
              passwordSecretRef:
                description: PasswordSecretRef seeds the restic password. Required
                  when adopting.
                properties:
                  key:
                    description: The key of the secret to select from.  Must be a
                      valid secret key.
                    type: string
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                  optional:
                    description: Specify whether the Secret or its key must be defined
                    type: boolean
                required:
                - key
                type: object
                x-kubernetes-map-type: atomic
              quotaGiB:
                description: QuotaGiB caps repository size. Unset means no quota.
                format: int32
                maximum: 1000000
                minimum: 1
                type: integer
              region:
                default: us
                description: Region is the BorgBase region to create the repository
                  in.
                type: string
              repositoryName:
                description: RepositoryName is the name given to the repository in
                  BorgBase. Defaults to the namespace.
                maxLength: 64
                type: string
              secretName:
                description: SecretName overrides the name of the Secret the operator
                  writes credentials to.
                maxLength: 253
                type: string
              suspend:
                description: Suspend stops reconciliation without deleting the resource.
                type: boolean
            type: object
          status:
            description: RepositoryStatus is the observed state of a Repository.
            properties:
              adopted:
                description: Adopted reports whether the repository pre-existed this
                  resource.
                type: boolean
              conditions:
                description: Conditions holds the latest observations of the repository's
                  state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              currentUsage:
                description: CurrentUsage is the human-readable size of the repository.
                type: string
              initialized:
                description: Initialized reports whether restic init has completed.
                type: boolean
              observedGeneration:
                description: ObservedGeneration is the spec generation this status
                  was computed from.
                format: int64
                type: integer
              quota:
                description: Quota is the human-readable quota, if one is set.
                type: string
              repositoryID:
                description: RepositoryID is the BorgBase repository ID.
                type: string
              secretName:
                description: SecretName is the Secret holding the repository credentials.
                type: string
              server:
                description: Server is the host serving the repository over REST.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: passwordSecretRef is required when adopting an existing repository,
            otherwise its snapshots would be unreadable
          rule: '!has(self.spec.existingRepositoryID) || has(self.spec.passwordSecretRef)'
        - message: existingRepositoryID cannot be changed or removed once set
          rule: '!has(oldSelf.spec.existingRepositoryID) || (has(self.spec.existingRepositoryID)
            && self.spec.existingRepositoryID == oldSelf.spec.existingRepositoryID)'
        - message: cannot adopt a different repository after one has been created
            for this resource
          rule: has(oldSelf.spec.existingRepositoryID) || !has(self.spec.existingRepositoryID)
            || !has(oldSelf.status) || !has(oldSelf.status.repositoryID)
        - message: secretName must not be the passwordSecretRef Secret; the operator
            never writes to the seed
          rule: '!has(self.spec.passwordSecretRef) || !has(self.spec.secretName) ||
            self.spec.secretName != self.spec.passwordSecretRef.name'
    served: true
    storage: true
    subresources:
      status: {}
