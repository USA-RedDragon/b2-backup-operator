name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref }}"
  cancel-in-progress: false

jobs:
  manager-image:
    name: Manager image
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: USA-RedDragon/reusable-actions/.github/workflows/docker-ci.yaml@c5ee15922a0ff4229b0f06a8d0551541b5cabfdc # v2.0.34
    with:
      push: true
      image-name: usa-reddragon/b2-backup-operator
      dockerfile: Dockerfile
      version: ${{ github.ref_name == 'main' && 'beta' || '' }}

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [manager-image]
    permissions:
      contents: write
      packages: write
    uses: USA-RedDragon/reusable-actions/.github/workflows/goreleaser.yaml@c5ee15922a0ff4229b0f06a8d0551541b5cabfdc # v2.0.34
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  release-manifests:
    name: Release manifests
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [manager-image]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Flux CLI
        uses: fluxcd/flux2/action@dd233c4fadef306a62b7893204f8e3817fecc2b2 # v2.9.5

      - name: Resolve the manager image digest
        id: digest
        run: |
          digest="$(docker buildx imagetools inspect "ghcr.io/usa-reddragon/b2-backup-operator:${GITHUB_REF_NAME}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate installer
        run: make build-installer IMG=ghcr.io/usa-reddragon/b2-backup-operator:${{ github.ref_name }}@${{ steps.digest.outputs.digest }}

      - name: Publish
        run: |
          flux push artifact \
            oci://ghcr.io/usa-reddragon/b2-backup-operator-manifests:${{ github.ref_name }} \
            --path=dist --source=${{ github.repositoryUrl }} --revision="${{ github.ref_name }}@sha1:${{ github.sha }}"
