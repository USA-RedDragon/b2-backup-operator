name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }} @ ${{ github.ref }}"
  cancel-in-progress: false

jobs:
  manager-image:
    name: Manager image
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: USA-RedDragon/reusable-actions/.github/workflows/docker-ci.yaml@ff5d8c9d1d9fda2d1ca4cb4325987a429db9a85a # v2.0.39
    with:
      push: true
      image-name: usa-reddragon/b2-backup-operator
      dockerfile: Dockerfile
      version: ${{ github.ref_name == 'main' && 'beta' || '' }}

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [manager-image]
    permissions:
      contents: write
      packages: write
    uses: USA-RedDragon/reusable-actions/.github/workflows/goreleaser.yaml@ff5d8c9d1d9fda2d1ca4cb4325987a429db9a85a # v2.0.39
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  release-manifests:
    name: Release manifests
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [manager-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Flux CLI
        uses: fluxcd/flux2/action@23dcfe98fe672acdf44ecd9c60cbac41b57f5de8 # v2.10.1

      - name: Resolve the manager image digest
        id: digest
        run: |
          digest="$(docker buildx imagetools inspect "ghcr.io/usa-reddragon/b2-backup-operator:${GITHUB_REF_NAME}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate installer
        run: make build-installer IMG=ghcr.io/usa-reddragon/b2-backup-operator:${{ github.ref_name }}@${{ steps.digest.outputs.digest }}

      - name: Publish
        run: |
          flux push artifact \
            oci://ghcr.io/usa-reddragon/b2-backup-operator-manifests:${{ github.ref_name }} \
            --path=dist --source=${{ github.repositoryUrl }} --revision="${{ github.ref_name }}@sha1:${{ github.sha }}"
