apiVersion: v1
kind: Namespace
metadata:
  name: notes
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notes-data
  namespace: notes
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 4Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes
  namespace: notes
  labels:
    app.kubernetes.io/name: notes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: notes
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notes
    spec:
      terminationGracePeriodSeconds: 1
      containers:
        - name: app
          image: docker.io/library/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          command: ["sleep", "infinity"]
          volumeMounts:
            - {name: data, mountPath: /data}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: notes-data
---
apiVersion: b2backup.mcswain.dev/v1
kind: Repository
metadata:
  name: restic
  namespace: notes
spec:
  mode: Prefix
  bucket: demo-backups
---
apiVersion: b2backup.mcswain.dev/v1
kind: ScheduledBackup
metadata:
  name: notes
  namespace: notes
spec:
  repositoryRef: {name: restic}
  schedule: "05 __HOUR__ * * *"
  sources:
    - {type: files, tag: files, paths: [notes, attachments]}
  retention: {last: 10, daily: 7, weekly: 4, monthly: 6}
  volumes:
    - {existingClaim: notes-data, mountPath: /data}
---
